# Tab-session key tables: the "tabbed split" below nvim in a workspace
# window. A tab-session (stack-*) is an ordinary session on this same server,
# shown as a nested client in the workspace window's bottom pane by
# ~/.config/tmux/stack-session.sh, which points the session at these tables
# (key-table stack-root) and styles it via session-scoped options. The tables
# are server-global but inert for every session that doesn't opt in.
#
# Mental model:
#   - Outer session = layout (nvim on top, the tabs pane below).
#   - Tab-session = tabs. Each of its windows is a tab.
#   - Cross-layer movement still uses the outer prefix + Arrow: the outer
#     session sees keys first and its is_inner_tmux check forwards the chord
#     as C-e <key>, which the nested client resolves in these tables.
#   - Tab switching uses no-prefix M-keys; the outer session doesn't bind
#     them, so they reach the nested client's stack-root table.

# Format-based vim detector (no subprocess per keypress): same rationale as
# is_vim_or_inner_f in ~/.tmux.conf.
is_vim_f="#{m/ri:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}}"

# Edge-escape helper: act on the OUTER pane hosting this tab-session's client.
# #{client_tty} is expanded by the binding, pinning the lookup to the client
# that pressed the key.
esc="~/.config/tmux/stack-escape.sh"

# Tab-sessions run with `prefix None`, so C-e enters stack-prefix explicitly
# (switch-client -T, the documented multi-prefix mechanism). C-e C-e sends a
# literal C-e to the app.
bind -T stack-root   C-e switch-client -T stack-prefix
bind -T stack-prefix C-e send-keys C-e

# Reload these tables.
bind -T stack-prefix r source-file ~/.config/tmux/stack.conf

# Cheatsheet for this layer.
bind -T stack-prefix ? display-popup -E -h 80% -w 80% "tmux list-keys -T stack-prefix | sort | less -R"

# Ctrl/Cmd + Up/Down: scroll the focused tab's output: receiving end of the
# outer C-Up/C-Down forward. Cases: vim tab → forward the chord; app with
# mouse reporting (Claude Code) → synthesise SGR wheel events; plain shell →
# copy-mode scroll (C-Down only once already in copy-mode). Copy-mode-table
# C-Up/C-Down continuation bindings are shared with the outer config.
bind -T stack-root C-Up   if -F "$is_vim_f" "send-keys C-Up"   "if -F '#{mouse_any_flag}' 'send-keys -N 3 Escape \"[<64;1;1M\"' 'copy-mode -e ; send-keys -X -N 3 scroll-up'"
bind -T stack-root C-Down if -F "$is_vim_f" "send-keys C-Down" "if -F '#{mouse_any_flag}' 'send-keys -N 3 Escape \"[<65;1;1M\"' 'if -F \"#{pane_in_mode}\" \"send-keys -X -N 3 scroll-down\"'"

# --- Tabs (= windows of the tab-session), no-prefix shortcuts ----------------
# The outer session never binds these, so they fall through to the client.
bind -T stack-root M-h previous-window
bind -T stack-root M-l next-window
bind -T stack-root M-1 select-window -t 1
bind -T stack-root M-2 select-window -t 2
bind -T stack-root M-3 select-window -t 3
bind -T stack-root M-4 select-window -t 4
bind -T stack-root M-5 select-window -t 5
bind -T stack-root M-6 select-window -t 6
bind -T stack-root M-7 select-window -t 7
bind -T stack-root M-8 select-window -t 8
bind -T stack-root M-9 select-window -t 9

# Prefix-based tab navigation/reordering: mirror the outer window bindings so
# the muscle memory carries across layers.
bind -T stack-prefix -r , previous-window
bind -T stack-prefix -r . next-window
bind -T stack-prefix -r < swap-window -d -t -1
bind -T stack-prefix -r > swap-window -d -t +1
# Prefix [ / ] → cycle nvim's buffer tabs when vim is focused (forward
# C-a [ / C-a ], the chord nvim's bufferline keymap expects), otherwise
# switch tabs. Receiving end of the outer is_inner_tmux chain: outer C-a [
# arrives here as C-e [.
bind -T stack-prefix -r '[' if -F "$is_vim_f" "send-keys C-a '['" "previous-window"
bind -T stack-prefix -r ']' if -F "$is_vim_f" "send-keys C-a ']'" "next-window"

# New tab in the current pane's directory.
bind -T stack-prefix c new-window -c "#{pane_current_path}"

# Rename tab and pin (disable automatic-rename so the custom name sticks).
bind -T stack-prefix t command-prompt -p "Rename tab:" "rename-window '%%' ; setw automatic-rename off"
bind -T stack-prefix T command-prompt -p "Rename tab (styled):" "rename-window '#[fg=green,bold]%%#[fg=default,nobold]' ; setw automatic-rename off"

# Pane splits inside a tab: model says tabs only, but kept for ad-hoc use.
bind -T stack-prefix \\ split-window -h -c "#{pane_current_path}"
bind -T stack-prefix - split-window -v -c "#{pane_current_path}"

# Enter select-mode (copy-mode): receiving end of the outer C-e v forward.
bind -T stack-prefix v copy-mode

# Prefix + Arrow → move between splits inside vim, OR between panes inside
# this tab, OR escape into the outer layout at the edge (via the helper, which
# resolves the hosting outer pane by client tty). Receiving end of the outer
# is_inner_tmux chain: outer C-a <Arrow> arrives here as C-e <Arrow>.
bind -T stack-prefix Up    if -F "$is_vim_f" "send-keys C-a Up"    "if -F '#{pane_at_top}'    \"run '$esc move U #{client_tty}'\" 'select-pane -U'"
bind -T stack-prefix Down  if -F "$is_vim_f" "send-keys C-a Down"  "if -F '#{pane_at_bottom}' \"run '$esc move D #{client_tty}'\" 'select-pane -D'"
bind -T stack-prefix Left  if -F "$is_vim_f" "send-keys C-a Left"  "if -F '#{pane_at_left}'   \"run '$esc move L #{client_tty}'\" 'select-pane -L'"
bind -T stack-prefix Right if -F "$is_vim_f" "send-keys C-a Right" "if -F '#{pane_at_right}'  \"run '$esc move R #{client_tty}'\" 'select-pane -R'"

# Prefix + x → close the current nvim buffer when vim is focused, otherwise
# kill the tab pane. Receiving end of the outer C-e x forward.
bind -T stack-prefix x if -F "$is_vim_f" "send-keys C-a x" "kill-pane"

# Prefix + S-Arrow → resize nvim splits when vim is focused, otherwise resize
# the tab pane; when the pane already spans the tab in that axis (resize would
# be a no-op) resize the hosting OUTER pane instead: same edge-escape as the
# Arrow chain.
bind -T stack-prefix -r S-Up    if -F "$is_vim_f" "send-keys C-a S-Up"    "if -F '#{e|==:#{pane_height},#{window_height}}' \"run '$esc resize U #{client_tty}'\" 'resize-pane -U 5'"
bind -T stack-prefix -r S-Down  if -F "$is_vim_f" "send-keys C-a S-Down"  "if -F '#{e|==:#{pane_height},#{window_height}}' \"run '$esc resize D #{client_tty}'\" 'resize-pane -D 5'"
bind -T stack-prefix -r S-Left  if -F "$is_vim_f" "send-keys C-a S-Left"  "if -F '#{e|==:#{pane_width},#{window_width}}'   \"run '$esc resize L #{client_tty}'\" 'resize-pane -L 5'"
bind -T stack-prefix -r S-Right if -F "$is_vim_f" "send-keys C-a S-Right" "if -F '#{e|==:#{pane_width},#{window_width}}'   \"run '$esc resize R #{client_tty}'\" 'resize-pane -R 5'"

# Standard prefix keys a tab-session should keep. stack-prefix starts empty
# (custom tables inherit nothing), so tmux defaults worth having are re-bound
# here explicitly.
bind -T stack-prefix : command-prompt
bind -T stack-prefix w choose-tree -Zw -f '#{==:#{session_name},#{client_session}}'
bind -T stack-prefix z resize-pane -Z
bind -T stack-prefix d detach-client
bind -T stack-prefix q display-panes
bind -T stack-prefix l last-window
bind -T stack-prefix o select-pane -t :.+
bind -T stack-prefix Space next-layout
bind -T stack-prefix '{' swap-pane -U
bind -T stack-prefix '}' swap-pane -D
bind -T stack-prefix & confirm-before -p "kill-window #W? (y/n)" kill-window
bind -T stack-prefix 0 select-window -t :=0
bind -T stack-prefix 1 select-window -t :=1
bind -T stack-prefix 2 select-window -t :=2
bind -T stack-prefix 3 select-window -t :=3
bind -T stack-prefix 4 select-window -t :=4
bind -T stack-prefix 5 select-window -t :=5
bind -T stack-prefix 6 select-window -t :=6
bind -T stack-prefix 7 select-window -t :=7
bind -T stack-prefix 8 select-window -t :=8
bind -T stack-prefix 9 select-window -t :=9
